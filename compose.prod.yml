services:
  drefinance-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: drefinance-app
    restart: unless-stopped

    mem_limit: 1g
    cpus: 0.75
    pids_limit: 250

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000

    ports:
      - "127.0.0.1:3001:3000"

    networks:
      - infra_backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  infra_backend:
    external: true
    name: infra_backend